<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>facebook clone project</title>
  </head>
  <body>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <div class="navbar">
      <div class="left_navbar">
        <img
          src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6c/Facebook_Logo_2023.png/960px-Facebook_Logo_2023.png"
          alt=""
          class="logo"
        />
        <input type="text" class="search-bar" placeholder="Search Facebook" />
      </div>
      <div class="navbar_center">
        <span class="material-symbols-outlined nav_icons"> home </span>
        <span class="material-symbols-outlined nav_icons"> live_tv </span>
        <span class="material-symbols-outlined nav_icons"> storefront </span>
        <span class="material-symbols-outlined nav_icons"> groups </span>
        <span class="material-symbols-outlined nav_icons"> explore </span>
      </div>
      <div class="navbar_right">
        <span class="material-symbols-outlined circle_icons"> add </span>
        <span class="material-symbols-outlined circle_icons">
          notifications</span
        >
        <span class="material-symbols-outlined circle_icons"> chat </span>
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQfZo-yq0CCloLYiCPNe5t7LS8pDZkHYKr0RsRwj8NfY-rIWEARK6rWWeM&s=10"
          alt="profile"
          class="profile"
        />
      </div>
    </div>

    <div class="story_section">
      <div class="story_container">
        <!-- Your Story -->
        <div class="story_wrapper">
          <div class="story">
            <img src="https://t3.ftcdn.net/jpg/11/97/02/28/360_F_1197022804_ccjqErJ5wZWJ05t9V7UL4lpBXyTo3doN.jpg" alt="Your Story">
        <div class="story_overlay">
              <span class="material-symbols-outlined add_story_icon">add</span>
            </div> 
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQfZo-yq0CCloLYiCPNe5t7LS8pDZkHYKr0RsRwj8NfY-rIWEARK6rWWeM&s=10" alt="profile" class="story_profile_pic">
          </div>
          <div class="story_name">Your Story</div>
        </div>

        <!-- Emms Story -->
        <div class="story_wrapper">
          <div class="story">
            <img src="https://images.unsplash.com/photo-1598103442097-8b74394b95c6?w=500&auto=format&fit=crop&q=60" alt="Emms">
            <img src="https://i.pravatar.cc/150?img=1" alt="profile" class="story_profile_pic">
          </div>
          <div class="story_name">Emms</div>
        </div>

        <!-- Liam Story -->
        <div class="story_wrapper">
          <div class="story">
            <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=500&auto=format&fit=crop&q=60" alt="Liam">
            <img src="https://i.pravatar.cc/150?img=2" alt="profile" class="story_profile_pic">
          </div>
          <div class="story_name">Liam</div>
        </div>

        <!-- Ava Story -->
        <div class="story_wrapper">
          <div class="story">
            <img src="https://images.unsplash.com/photo-1632060203819-4a605c798db3?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OXx8bG92ZSUyMGRvbGx8ZW58MHx8MHx8fDA%3D" alt="Ava">
            <img src="https://i.pravatar.cc/150?img=3" alt="profile" class="story_profile_pic">
          </div>
          <div class="story_name">Ava</div>
        </div>

        <!-- Noah Story -->
        <div class="story_wrapper">
          <div class="story">
            <img src="https://images.unsplash.com/photo-1495345679747-53991aedf9c2?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8N3x8bG92ZSUyMGRvbGx8ZW58MHx8MHx8fDA%3D" alt="Noah">
            <img src="https://i.pravatar.cc/150?img=4" alt="profile" class="story_profile_pic">
          </div>
          <div class="story_name">Noah</div>
        </div>
      </div>
    </div>
  </body>
</html>
